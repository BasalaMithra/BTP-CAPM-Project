_schema-version: 3.3.0
ID: capm
description: A simple CAP project.
version: 1.3.2
modules:
- name: capm-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: capm-db
  - name: capm-xsuaa
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: capm-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: capm-db
  parameters:
    buildpack: nodejs_buildpack
- name: capm-destination-content
  type: com.sap.application.content
  requires:
  - name: capm-destination-service
    parameters:
      content-target: true
  - name: capm_html_repo_host
    parameters:
      service-key:
        name: capm_html_repo_host-key
  - name: capm-xsuaa
    parameters:
      service-key:
        name: capm-xsuaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: purchaseorder_capm_html_repo_host
          ServiceInstanceName: capm-html5-app-host-service
          ServiceKeyName: capm_html_repo_host-key
          sap.cloud.service: purchaseorder
        - Authentication: OAuth2UserTokenExchange
          Name: purchaseorder_capm_xsuaa
          ServiceInstanceName: capm-xsuaa
          ServiceKeyName: capm-xsuaa-key
          sap.cloud.service: purchaseorder
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: capm-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: capm_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - mithraapppurchaseorderapp.zip
      name: mithraapppurchaseorderapp
      target-path: resources/
- name: mithraapppurchaseorderapp
  type: html5
  path: app/purchaseorderapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: capm-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    hdi-service-name: ${service-name}
- name: capm-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: capm-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: capm-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: capm_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: capm-html5-app-host-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
