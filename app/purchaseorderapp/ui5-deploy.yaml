

specVersion: "4.0"
metadata:
  name: mithra.app.purchaseorderapp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: mithraapppurchaseorderapp
        relativePaths: true
        additionalFiles:
          - xs-app.json
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
